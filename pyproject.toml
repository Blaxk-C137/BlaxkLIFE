[project]
name = "blxverse"
version = "0.6.0"
description = "BLXVERSE - Living AI World (vertical slice)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"blxverse/content/dialogue_content.py" = ["E501"]
"tests/*" = ["E501"]
